; PHP embarqué dans OUTECH.exe (mode local).
; Les ${…} sont des variables posées par OUTECH.exe au lancement.
extension_dir = "${OUTECH_PHP_EXT}"
extension=pdo_sqlite
extension=mbstring
extension=zip

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
date.timezone = Africa/Casablanca

; Fourni par OUTECH.exe (%LOCALAPPDATA%\OUTECH\sessions).
session.save_path = "${OUTECH_SESSIONS}"
session.gc_maxlifetime = 43200

display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
opcache.enable = 0
